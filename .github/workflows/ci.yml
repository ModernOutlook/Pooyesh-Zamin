name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  worker-and-migrations:
    name: Worker syntax and D1 migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Check Worker JavaScript syntax
        run: node --check src/index.js
      - name: Validate Wrangler configuration
        run: npx wrangler deploy --dry-run
      - name: Apply migrations to an ephemeral SQLite database
        run: |
          python - <<'PY'
          import pathlib, sqlite3
          db = sqlite3.connect(':memory:')
          for path in sorted(pathlib.Path('migrations').glob('*.sql')):
              db.executescript(path.read_text(encoding='utf-8'))
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {'users', 'sessions', 'waste_records', 'posts', 'location_records'} <= tables
          columns = {row[1] for row in db.execute('PRAGMA table_info(location_records)')}
          assert {'latitude', 'longitude', 'capture_height_m', 'image_key'} <= columns
          print('D1 migrations applied successfully')
          PY

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        run: gradle -p android assembleDebug
