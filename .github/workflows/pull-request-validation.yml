name: Pull request validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Worker JavaScript syntax
        run: node --check src/index.js
      - name: Validate both interface entry points and switch persistence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const light = fs.readFileSync('public/index.html', 'utf8');
          const dark = fs.readFileSync('public/dark.html', 'utf8');
          const sw = fs.readFileSync('public/sw.js', 'utf8');
          for (const [name, html, target] of [
            ['light', light, './dark.html'],
            ['dark', dark, './index.html'],
          ]) {
            assert.match(html, /id="theme-switch"/, name + ' theme switch missing');
            assert.match(html, /pooyesh-interface-v1/, name + ' preference key missing');
            assert.ok(html.includes(target), name + ' switch target missing');
            assert.match(html, /localStorage\.setItem/, name + ' preference persistence missing');
          }
          assert.match(sw, /dark\.html/, 'dark page must be in offline precache');
          assert.match(sw, /caches\.match\(r\)/, 'navigation fallback must respect requested path');
          console.log('Both themes, preference persistence and offline navigation checks passed.');
          NODE
      - name: Wrangler configuration dry run
        run: npx wrangler@4 deploy --dry-run
      - name: Validate ordered D1 migrations in ephemeral SQLite
        if: ${{ hashFiles('migrations/0001_initial_schema.sql') != '' }}
        run: |
          python - <<'PY'
          import pathlib, sqlite3
          db = sqlite3.connect(':memory:')
          migrations = sorted(pathlib.Path('migrations').glob('*.sql'))
          assert len(migrations) == 4, f'Expected 4 migrations, found {len(migrations)}'
          for path in migrations:
              db.executescript(path.read_text(encoding='utf-8'))
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {'users', 'sessions', 'waste_records', 'posts', 'location_records'} <= tables
          user_columns = {row[1] for row in db.execute('PRAGMA table_info(users)')}
          assert {'name', 'account_type', 'address', 'area'} <= user_columns
          location_columns = {row[1] for row in db.execute('PRAGMA table_info(location_records)')}
          assert {'latitude', 'longitude', 'capture_height_m', 'image_key'} <= location_columns
          print('All D1 migrations applied successfully')
          PY

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        if: ${{ hashFiles('android/app/build.gradle.kts') != '' }}
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: ${{ hashFiles('android/app/build.gradle.kts') != '' }}
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        if: ${{ hashFiles('android/app/build.gradle.kts') != '' }}
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ hashFiles('android/app/build.gradle.kts') != '' }}
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        if: ${{ hashFiles('android/app/build.gradle.kts') != '' }}
        run: gradle -p android assembleDebug
