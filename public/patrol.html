<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>برنامه نیروی گشت | پویش زمین</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#e9f7ef,#eaf3fb);font-family:Tahoma,"Segoe UI",sans-serif;color:#173b35}header{background:#07533f;color:#fff;padding:18px max(18px,calc((100% - 900px)/2));display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}main{width:min(900px,94vw);margin:26px auto}.panel,.job{background:#fff;border:1px solid #d7e8df;border-radius:17px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #174d3a10}.hidden{display:none!important}h1,h2{color:#07533f;margin-top:0}.muted{color:#638078;line-height:1.8}label{display:block;margin:12px 0 6px;font-weight:bold}input{width:100%;padding:12px;border:1px solid #c7ddd2;border-radius:10px;font:inherit}button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:#168a5a;color:white;cursor:pointer;font-weight:bold}button.secondary{background:#e7f2ec;color:#145c45}button:disabled{opacity:.5}.pill{background:#fff1cc;color:#785500;border-radius:30px;padding:5px 10px;font-size:12px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.job p{line-height:1.9}.actions{display:flex;gap:8px;flex-wrap:wrap}.msg{padding:10px;background:#eef7f2;border-radius:10px;margin:10px 0}.error{background:#fff0ee;color:#9a3028}
</style></head><body><header><b>♻ پویش زمین | برنامه نیروی گشت</b><span id="who">بارهای ارجاع‌شده به شما</span></header><main>
<section id="auth" class="panel"><h1>ورود نیروی گشت</h1><p class="muted">با حساب کاربری که مدیر سامانه در اختیارتان قرار داده وارد شوید.</p><form id="login"><label>نام کاربری</label><input name="username" required autocomplete="username"><label>گذرواژه</label><input name="password" type="password" required autocomplete="current-password"><button>ورود</button></form><div id="authMsg" class="msg hidden"></div></section>
<section id="app" class="hidden"><div class="row"><h1>بارهای ارجاع‌شده</h1><div class="actions"><button id="refresh" class="secondary">به‌روزرسانی</button><button id="logout">خروج</button></div></div><div id="jobs"></div></section></main>
<script>
(()=>{'use strict';const API='https://pooyesh-zamin-api.game-kazem9877.workers.dev',KEY='pz_patrol_token',$=id=>document.getElementById(id);let token=localStorage.getItem(KEY)||[];
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>{try{return new Date(v).toLocaleString('fa-IR')}catch{return v||'—'}};
async function req(path,opts={}){const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...opts.headers}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطای '+r.status);return d;}
function showError(id,t){$(id).textContent=t;$(id).classList.remove('hidden');$(id).classList.add('error')}
async function enter(t){token=t;localStorage.setItem(KEY,t);const me=await req('/api/auth/me');if(me.user.role!=='patrol')throw Error('این حساب، حساب نیروی گشت نیست.');$('who').textContent=me.user.display_name;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await refresh();}
function payload(j){try{return JSON.parse(j.payload_json||'{}')}catch{return{}}}function safeHttps(v){try{const u=new URL(v);return u.protocol==='https:'?u.href:''}catch{return''}}
async function refresh(){const d=await req('/api/patrol/assignments');$('jobs').innerHTML=(d.assignments||[]).length?d.assignments.map(a=>{const p=payload(a),items=p.wasteItems||p.items||[],loc=p.location||{};return '<article class="job"><div class="row"><h2>'+esc(a.load_number)+'</h2><span class="pill">'+({assigned:'ارجاع‌شده',accepted:'پذیرفته‌شده',collected:'تحویل گرفته‌شده'}[a.status]||a.status)+'</span></div><p><b>نشانی:</b> '+esc(p.address||'—')+'</p><p><b>اقلام:</b> '+esc(Array.isArray(items)?items.join('، '):items)+'</p><p><b>زمان ثبت:</b> '+date(a.submitted_at)+'</p>'+(safeHttps(loc.maps)?'<p><a target="_blank" rel="noopener" href="'+esc(safeHttps(loc.maps))+'">مسیریابی / مشاهده موقعیت</a></p>':'')+(p.photo?'<p><a target="_blank" href="'+esc(p.photo.startsWith('data:image/')||p.photo.startsWith('https://')?p.photo:'https://raw.githubusercontent.com/ModernOutlook/Pooyesh-Zamin/main/'+p.photo)+'">تصویر ثبت‌شده</a></p>':'')+'<div class="actions">'+(a.status==='assigned'?'<button data-status="accepted" data-id="'+a.id+'">پذیرش مأموریت</button>':'')+(a.status==='accepted'?'<button data-status="collected" data-id="'+a.id+'">ثبت دریافت بار</button>':'')+'</div></article>'}).join(''):'<div class="panel muted">در حال حاضر باری به شما ارجاع نشده است.</div>';}
$('login').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(!r.ok)throw Error(d.error||'ورود ناموفق');await enter(d.token);}catch(x){showError('authMsg',x.message)}};
$('jobs').onclick=async e=>{const b=e.target.closest('[data-status]');if(!b)return;try{await req('/api/patrol/assignments/'+encodeURIComponent(b.dataset.id),{method:'PATCH',body:JSON.stringify({status:b.dataset.status})});await refresh();}catch(x){alert(x.message)}};
$('refresh').onclick=()=>refresh().catch(x=>alert(x.message));$('logout').onclick=()=>{localStorage.removeItem(KEY);token='';location.reload();};if(token&&typeof token==='string')enter(token).catch(()=>{localStorage.removeItem(KEY);token='';});
})();</script></body></html>
