<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>پویش زمین | پرونده‌های میدانی</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#eef3f4;color:#18313a}
main{max-width:980px;margin:32px auto;padding:20px}.panel,.record{background:#fff;border:1px solid #d6e0e3;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #163b4510}
h1{margin:0 0 8px;font-size:1.6rem}.muted{color:#60757c;font-size:.9rem}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #bacbd0}input{width:100%;margin:8px 0}button{background:#123d49;color:#fff;cursor:pointer;border:0}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.record h2{font-size:1.05rem;margin:0 0 12px}.record p{margin:7px 0;overflow-wrap:anywhere}.record img{display:block;max-width:100%;max-height:360px;object-fit:contain;border-radius:12px;margin-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{color:#126077}.status{margin:12px 0;white-space:pre-wrap}.hidden{display:none}
</style></head>
<body><main>
<section class="panel">
<h1>پویش زمین</h1><p class="muted">پنل مشاهده موقعیت‌ها و مستندات میدانی ثبت‌شده</p>
<label for="token">توکن دسترسی شرکت</label><input id="token" type="password" autocomplete="off" placeholder="توکن COMPANY_ACCESS_TOKEN را وارد کنید">
<div class="actions"><button id="load">دریافت پرونده‌ها</button><button id="more" disabled>دریافت موارد بعدی</button></div>
<div id="status" class="status muted">توکن دسترسی شرکت را وارد کنید. این صفحه آن را ذخیره نمی‌کند.</div>
</section><section id="records"></section>
</main>
<script>
(() => {
  const tokenInput=document.getElementById("token"), status=document.getElementById("status"), records=document.getElementById("records"), more=document.getElementById("more");
  let cursor=0, accessToken="";
  const setStatus=(message)=>{status.textContent=message;};
  async function api(path){const response=await fetch(path,{headers:{Authorization:"Bearer "+accessToken}});if(!response.ok){let message="درخواست ناموفق بود ("+response.status+")";try{message=(await response.json()).error||message}catch{}throw new Error(message)}return response;}
  function addText(parent,label,value){const p=document.createElement("p");const b=document.createElement("strong");b.textContent=label+"؛ ";p.append(b,document.createTextNode(value??"—"));parent.append(p);}
  async function load(reset){
    accessToken=tokenInput.value.trim();if(!accessToken){setStatus("توکن را وارد کنید.");return}
    if(reset){cursor=0;records.replaceChildren()}
    setStatus("در حال دریافت پرونده‌ها…");
    try{
      const data=await (await api("/api/company/location-records?limit=50&after_id="+cursor)).json();
      for(const item of data.records||[]){
        const card=document.createElement("article");card.className="record";
        const title=document.createElement("h2");title.textContent="پرونده شماره "+item.id;card.append(title);
        addText(card,"کاربر",item.phone);addText(card,"عرض جغرافیایی",item.latitude);addText(card,"طول جغرافیایی",item.longitude);
        addText(card,"دقت GPS",item.accuracy_m==null?"ثبت نشده":item.accuracy_m+" متر");
        addText(card,"ارتفاع GPS گوشی",item.altitude_m==null?"ثبت نشده":item.altitude_m+" متر");
        addText(card,"ارتفاع اعلام‌شده دوربین",item.capture_height_m==null?"ثبت نشده":item.capture_height_m+" متر (نیازمند راستی‌آزمایی)");
        addText(card,"زمان ثبت",item.captured_at);addText(card,"نوع تصویر",item.image_kind);addText(card,"منبع تصویر",item.image_source);addText(card,"توضیحات",item.notes);
        const actions=document.createElement("div");actions.className="actions";
        const map=document.createElement("a");map.href="https://www.openstreetmap.org/?mlat="+encodeURIComponent(item.latitude)+"&mlon="+encodeURIComponent(item.longitude)+"#map=19/"+item.latitude+"/"+item.longitude;map.target="_blank";map.rel="noopener";map.textContent="نمایش روی نقشه";actions.append(map);card.append(actions);
        if(item.image_url){
          const imageResponse=await api(item.image_url);const blob=await imageResponse.blob();const objectUrl=URL.createObjectURL(blob);
          if(blob.type.startsWith("image/")&&!blob.type.includes("tiff")){const img=document.createElement("img");img.src=objectUrl;img.alt="تصویر مستند پرونده "+item.id;card.append(img)}
          const download=document.createElement("a");download.href=objectUrl;download.download="pooyesh-field-"+item.id;download.textContent="دریافت فایل تصویر";actions.append(download);
        }
        records.append(card);cursor=item.id;
      }
      more.disabled=!data.next_cursor||!data.records?.length;
      setStatus((data.records||[]).length+" پرونده دریافت شد.");
    }catch(error){setStatus(error.message||"خطا در دریافت اطلاعات.");}
  }
  document.getElementById("load").addEventListener("click",()=>load(true));
  more.addEventListener("click",()=>load(false));
})();
</script></body></html>
